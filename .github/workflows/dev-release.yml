name: Dev Release

on:
  push:
    branches: [master]

# 避免连续推送时并发更新同一 dev release
concurrency:
  group: dev-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dev-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon

      - name: Publish dev build to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          name: dev
          body: |
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Built at: ${{ github.event.head_commit.timestamp }}

            开发版（每次推送 master 自动更新）：从 Actions 校验过的源码构建。
            安装：下载 zip → IDE 中 `Settings → Plugins → ⚙ → Install Plugin from Disk...`。
          prerelease: true
          files: build/distributions/*.zip
