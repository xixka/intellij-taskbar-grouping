name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify-all-ides:
        description: '全量验证区间边界（ideaIC 2022.3.3 + IntelliJ IDEA 2026.2.3）'
        type: boolean
        default: false

# 新推送取消同分支的旧运行（含其 release 环节，dev 产物始终对应最新 master）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test and verify plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # IDE 分发（常规仅编译目标 2024.1.7，一套）与解包 transforms 缓存。
      # 实证（Gradle 8.10.2 本地全链跑 verifyPlugin）：transforms 实际落
      # ~/.gradle/caches/<版本>/transforms —— 旧键的 transforms 是幽灵路径从未命中，
      # 每轮都在 build 步骤重做 IDE 解包/插装，多 IDE 时缓存超 10GB 被驱逐抖动。
      # 键含 build.gradle.kts 与 wrapper（版本升级自然换键）；v2 前缀起新键系，
      # 不回灌旧幽灵条目（其内含 3 套 IDE 分发的死重）
      - name: Cache IDE distributions and transforms
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/8.10.2/transforms
          key: ${{ runner.os }}-intellij-dists-v2-${{ hashFiles('build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-intellij-dists-v2-

      - name: Build, test and verify plugin
        # 常规仅验证编译目标 2024.1.7；手动触发勾选 verify-all-ides 时加验证区间边界
        run: |
          GRADLE_ARGS=""
          if [ "${{ github.event.inputs.verify-all-ides }}" = "true" ]; then
            GRADLE_ARGS="-PverifyAllIdes=true"
          fi
          ./gradlew test buildPlugin verifyPlugin $GRADLE_ARGS --stacktrace --no-daemon

      - name: Upload plugin distribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idea-taskbar-ungroup-dist
          path: build/distributions/*.zip
          if-no-files-found: warn

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier/**
          if-no-files-found: warn

  windows-smoke:
    name: Windows functional smoke test (external-app ungrouping)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 沙箱 IDE 缓存：modules-2（ideaIC 分发）+ 8.10.2/transforms（Gradle 8 实际解包落点）
      - name: Cache sandbox IDE distribution
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/8.10.2/transforms
          key: ${{ runner.os }}-intellij-dists-v2-${{ hashFiles('build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-intellij-dists-v2-

      - name: Prepare sandbox IDE with plugin
        shell: pwsh
        run: ./gradlew prepareSandbox --no-daemon --console=plain

      - name: Seed plugin settings with notepad.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pluginsDir = Get-ChildItem 'build/idea-sandbox' -Recurse -Directory -Filter 'plugins' | Select-Object -First 1
          if (-not $pluginsDir) { throw "sandbox plugins dir not found under build/idea-sandbox" }
          $sandboxRoot = $pluginsDir.Parent.FullName
          Write-Host "Sandbox root: $sandboxRoot"
          $optionsDir = Join-Path $sandboxRoot 'config/options'
          New-Item -ItemType Directory -Force -Path $optionsDir | Out-Null
          # 权威格式（XmlSerializer 单测实证）：List 属性需 <list> 包裹条目
          $xml = @'
          <application>
            <component name="TaskbarUngroup">
              <option name="exeEntries">
                <list>
                  <option value="C:\Windows\System32\notepad.exe" />
                </list>
              </option>
            </component>
          </application>
          '@
          Set-Content -Path (Join-Path $optionsDir 'taskbarUngroup.xml') -Value $xml -Encoding UTF8
          # 双保险：同时预置 system/options（RoamingType.DISABLED 的实际落点以 IDE 为准）
          $sysOptionsDir = Join-Path $sandboxRoot 'system/options'
          New-Item -ItemType Directory -Force -Path $sysOptionsDir | Out-Null
          Set-Content -Path (Join-Path $sysOptionsDir 'taskbarUngroup.xml') -Value $xml -Encoding UTF8
          # 预置 FUS 同意状态（组件名如不匹配会被 IDE 忽略，无副作用）
          $fus = @'
          <application>
            <component name="UsageStatistics">
              <option name="isShown" value="true" />
            </component>
          </application>
          '@
          Set-Content -Path (Join-Path $optionsDir 'usages-statistics.xml') -Value $fus -Encoding UTF8
          Get-Content (Join-Path $optionsDir 'taskbarUngroup.xml')

      - name: Seed EUA acceptance state (suppress User Agreement dialog)
        # 根因（EndUserAgreement.java/Prefs.java 源码确认）：首启「IntelliJ IDEA User Agreement」
        # 弹窗由 java.util.prefs 接受版本号判定，社区版键为 euaCommunity_accepted_version。
        # 用 Java 写入以自动处理 JDK 的 Windows 注册表名称编码，避免直写注册表踩坑。
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import java.util.prefs.Preferences;

          public class SeedEua {
              public static void main(String[] args) throws Exception {
                  Preferences p = Preferences.userRoot().node("jetbrains/privacy_policy");
                  // ideaIC document name is "euaCommunity" -> value name lowercased
                  p.put("euacommunity_accepted_version", "999.999");
                  // harmless extras for other product variants
                  p.put("eua_accepted_version", "999.999");
                  p.put("ij_euaeap_accepted_version", "999.999");
                  p.put("accepted_version", "999.999");
                  p.flush();
                  System.out.println("EUA acceptance seeded: " + p.get("euacommunity_accepted_version", null));
              }
          }
          '@ | Set-Content -Path SeedEua.java -Encoding ASCII
          javac SeedEua.java
          java SeedEua
          # 预置数据共享同意状态（ConsentOptions.java: confirmed 为 null 才弹窗；条目格式 id:version:1:time）
          $consentDir = Join-Path $env:APPDATA 'JetBrains/consentOptions'
          New-Item -ItemType Directory -Force -Path $consentDir | Out-Null
          Set-Content -Path (Join-Path $consentDir 'accepted') -Value 'rsch.send.usage.stat:999.999:1:0' -Encoding ASCII
          Write-Host "consent seeded: $(Get-Content (Join-Path $consentDir 'accepted'))"

      - name: Boot sandbox IDE, launch notepad, assert AUMID (single process tree)
        # 关键：IDE 与断言必须在同一步骤内（同一进程树）。
        # 实证（run 37018190454）：boot 步骤退出后 runner 清理其进程树，
        # IDE 在数秒内被终止——sweep 停止、java 窗口从基线消失，而 notepad
        # 属下一步进程树得以存活。合并后断言全程有 IDE 在场。
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # init script: 向 runIde 的 JVM 追加 -Djb.consents.confirmation.enabled=false（彻底禁用同意弹窗）
          @'
          allprojects {
              tasks.matching { it.name == 'runIde' }.configureEach {
                  doFirst {
                      def cur = it.jvmArgs ?: []
                      it.jvmArgs = cur + ['-Djb.consents.confirmation.enabled=false']
                  }
              }
          }
          '@ | Set-Content -Path ci-init.gradle -Encoding ASCII
          Start-Process -FilePath './gradlew.bat' -ArgumentList 'runIde', '-I', 'ci-init.gradle', '--no-daemon', '--console=plain' `
            -WorkingDirectory (Get-Location) -RedirectStandardOutput 'ide-stdout.log' -RedirectStandardError 'ide-stderr.log'
          # 无人值守 CI：转储可见窗口标题（定位阻塞弹窗）+ 按键关闭 java 进程的模态弹窗
          $shell = New-Object -ComObject WScript.Shell
          $nativeDialogPattern = 'Security Alert|安全警报|Windows 安全|Firewall|防火墙'
          $deadline = (Get-Date).AddSeconds(420)
          $dumped = @{}
          $attempt = 0
          $uiWindows = @()
          while ((Get-Date) -lt $deadline) {
            $uiWindows = @(Get-Process | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object Id, ProcessName, MainWindowTitle)
            foreach ($w in $uiWindows) {
              $sig = "$($w.ProcessName)|$($w.MainWindowTitle)"
              if (-not $dumped.ContainsKey($sig)) {
                $dumped[$sig] = $true
                Write-Host "WINDOW: $sig (pid $($w.Id))"
              }
            }
            try {
              $dlg = $uiWindows | Where-Object { ($_.ProcessName -eq 'java' -and $_.MainWindowTitle) -or ($_.MainWindowTitle -match $nativeDialogPattern) } | Select-Object -First 1
              if ($dlg -and $shell.AppActivate($dlg.Id)) {
                Start-Sleep -Milliseconds 400
                # 轮换按键：ENTER(默认按钮) / ESC(取消) / TAB+SPACE(聚焦按钮后按下)
                switch ($attempt % 3) {
                  0 { $shell.SendKeys('{ENTER}'); Write-Host "Sent ENTER to: '$($dlg.MainWindowTitle)'" }
                  1 { $shell.SendKeys('{ESC}'); Write-Host "Sent ESC to: '$($dlg.MainWindowTitle)'" }
                  2 { $shell.SendKeys('{TAB} '); Write-Host "Sent TAB+SPACE to: '$($dlg.MainWindowTitle)'" }
                }
                $attempt++
              }
            } catch { }
            $log = Get-ChildItem 'build/idea-sandbox' -Recurse -Filter 'idea.log' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($log -and (Select-String -Path $log.FullName -Pattern 'Taskbar Ungroup: service initialized' -Quiet -ErrorAction SilentlyContinue)) {
              Write-Host "IDE booted, plugin service initialized (log: $($log.FullName))"
              break
            }
            Start-Sleep -Seconds 3
          }
          if (-not ($log -and (Select-String -Path $log.FullName -Pattern 'Taskbar Ungroup: service initialized' -Quiet -ErrorAction SilentlyContinue))) {
            Write-Host 'IDE boot timeout: plugin service not initialized within 420s'
            Write-Host 'Final visible windows:'
            foreach ($w in $uiWindows) { Write-Host "  $($w.ProcessName): '$($w.MainWindowTitle)'" }
            exit 1
          }

          # ---- 同进程树内执行外部应用冒烟断言 ----
          Start-Sleep -Seconds 5   # 等待 JNA 就绪与欢迎屏稳定
          Start-Process notepad
          Start-Process notepad
          Start-Sleep -Seconds 3
          $ErrorActionPreference = 'Continue'
          .github/scripts/taskbar-aumid-check.ps1 -ProcessNames notepad -MinWindows 2 -TimeoutSeconds 60
          $result = $LASTEXITCODE
          if ($result -ne 0) { Get-Content 'ide-stdout.log' -Tail 50 -ErrorAction SilentlyContinue }
          exit $result

      - name: Collect diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem 'build/idea-sandbox' -Recurse -Filter 'idea.log' -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName "idea-$($_.Directory.Parent.Name).log" }
          Get-ChildItem 'build/idea-sandbox' -Recurse -Filter '*.xml' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'options' } |
            ForEach-Object { Copy-Item $_.FullName "opts-$($_.Name)" -Force }
          Write-Host '--- sandbox tree ---'
          Get-ChildItem 'build/idea-sandbox' -Recurse -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          Write-Host '--- taskbarUngroup.xml (config) ---'
          Get-Content 'build/idea-sandbox/*/config/options/taskbarUngroup.xml' -ErrorAction SilentlyContinue
          Write-Host '--- taskbarUngroup.xml (system) ---'
          Get-Content 'build/idea-sandbox/*/system/options/taskbarUngroup.xml' -ErrorAction SilentlyContinue
          Get-Content 'ide-stderr.log' -ErrorAction SilentlyContinue | Select-Object -Last 30

      - name: Upload IDE logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-ide-logs
          path: |
            idea-*.log
            ide-stdout.log
            ide-stderr.log
            opts-*.xml
          if-no-files-found: ignore

      - name: Cleanup IDE and notepad
        if: always()
        shell: pwsh
        run: |
          Stop-Process -Name notepad -Force -ErrorAction SilentlyContinue
          taskkill /F /IM java.exe /T 2>$null
          exit 0

  dev-release:
    name: Publish dev build to GitHub Releases
    needs: [build, windows-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download plugin distribution
        uses: actions/download-artifact@v4
        with:
          name: idea-taskbar-ungroup-dist

      - name: Publish dev build to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          name: dev
          body: |
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Built at: ${{ github.event.head_commit.timestamp }}

            开发版（每次推送 master 自动更新）：Linux 编译+兼容性验证、Windows 实测（沙箱 IDE + 外部应用 AUMID 写入断言）全部通过后发布。
            安装：下载 zip → IDE 中 `Settings → Plugins → ⚙ → Install Plugin from Disk...`。
          prerelease: true
          files: idea-taskbar-ungroup-*.zip
