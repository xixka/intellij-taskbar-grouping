name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# 新推送取消同分支的旧运行（含其 release 环节，dev 产物始终对应最新 master）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test and verify plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test and verify plugin
        run: ./gradlew test buildPlugin verifyPlugin --stacktrace --no-daemon

      - name: Upload plugin distribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idea-taskbar-ungroup-dist
          path: build/distributions/*.zip
          if-no-files-found: warn

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier/**
          if-no-files-found: warn

  windows-smoke:
    name: Windows functional smoke test (external-app ungrouping)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare sandbox IDE with plugin
        shell: pwsh
        run: ./gradlew prepareSandbox --no-daemon --console=plain

      - name: Seed plugin settings with notepad.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pluginsDir = Get-ChildItem 'build/idea-sandbox' -Recurse -Directory -Filter 'plugins' | Select-Object -First 1
          if (-not $pluginsDir) { throw "sandbox plugins dir not found under build/idea-sandbox" }
          $sandboxRoot = $pluginsDir.Parent.FullName
          Write-Host "Sandbox root: $sandboxRoot"
          $optionsDir = Join-Path $sandboxRoot 'config/options'
          New-Item -ItemType Directory -Force -Path $optionsDir | Out-Null
          $xml = @'
          <application>
            <component name="TaskbarUngroup">
              <option name="exeEntries">
                <option value="C:\Windows\System32\notepad.exe" />
              </option>
            </component>
          </application>
          '@
          Set-Content -Path (Join-Path $optionsDir 'taskbarUngroup.xml') -Value $xml -Encoding UTF8
          Get-Content (Join-Path $optionsDir 'taskbarUngroup.xml')

      - name: Boot sandbox IDE in background
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Process -FilePath './gradlew.bat' -ArgumentList 'runIde', '--no-daemon', '--console=plain' `
            -WorkingDirectory (Get-Location) -RedirectStandardOutput 'ide-stdout.log' -RedirectStandardError 'ide-stderr.log'
          $deadline = (Get-Date).AddSeconds(240)
          while ((Get-Date) -lt $deadline) {
            $log = Get-ChildItem 'build/idea-sandbox' -Recurse -Filter 'idea.log' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($log -and (Select-String -Path $log.FullName -Pattern 'Taskbar Ungroup: service initialized' -Quiet -ErrorAction SilentlyContinue)) {
              Write-Host "IDE booted, plugin service initialized (log: $($log.FullName))"
              Start-Sleep -Seconds 10
              exit 0
            }
            Start-Sleep -Seconds 3
          }
          Write-Host 'IDE boot timeout: plugin service not initialized within 240s'
          exit 1

      - name: Launch notepad windows and assert AUMID assignment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Start-Process notepad
          Start-Process notepad
          Start-Sleep -Seconds 3
          .github/scripts/taskbar-aumid-check.ps1 -ProcessNames notepad -MinWindows 2 -TimeoutSeconds 60
          $result = $LASTEXITCODE
          if ($result -ne 0) { Get-Content 'ide-stdout.log' -Tail 50 -ErrorAction SilentlyContinue }
          exit $result

      - name: Collect diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem 'build/idea-sandbox' -Recurse -Filter 'idea.log' -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName "idea-$($_.Directory.Parent.Name).log" }
          Get-Content 'ide-stderr.log' -ErrorAction SilentlyContinue | Select-Object -Last 30

      - name: Upload IDE logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-ide-logs
          path: |
            idea-*.log
            ide-stdout.log
            ide-stderr.log
          if-no-files-found: ignore

      - name: Cleanup IDE and notepad
        if: always()
        shell: pwsh
        run: |
          Stop-Process -Name notepad -Force -ErrorAction SilentlyContinue
          taskkill /F /IM java.exe /T 2>$null
          exit 0

  dev-release:
    name: Publish dev build to GitHub Releases
    needs: [build, windows-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download plugin distribution
        uses: actions/download-artifact@v4
        with:
          name: idea-taskbar-ungroup-dist

      - name: Publish dev build to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          name: dev
          body: |
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Built at: ${{ github.event.head_commit.timestamp }}

            开发版（每次推送 master 自动更新）：Linux 编译+兼容性验证、Windows 实测（沙箱 IDE + 外部应用 AUMID 写入断言）全部通过后发布。
            安装：下载 zip → IDE 中 `Settings → Plugins → ⚙ → Install Plugin from Disk...`。
          prerelease: true
          files: idea-taskbar-ungroup-*.zip
