name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile and package plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and verify plugin
        run: ./gradlew buildPlugin verifyPlugin --stacktrace --no-daemon

      - name: Upload plugin distribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idea-taskbar-ungroup-dist
          path: build/distributions/*.zip
          if-no-files-found: warn

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-reports
          path: build/reports/pluginVerifier/**
          if-no-files-found: warn
